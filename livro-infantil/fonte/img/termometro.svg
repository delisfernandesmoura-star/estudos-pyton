<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350"><style>text{font-family:Nunito,Arial,sans-serif;fill:#2B2622} .t{font-family:Fredoka,Nunito,sans-serif;font-size:17px;font-weight:600;fill:#2B2622} .l{font-size:14px;font-weight:700} .s{font-size:12.5px;fill:#7a7068;font-weight:600}</style><text class="t" x="320" y="26" text-anchor="middle">O TERMÔMETRO DO VOLUME</text><rect x="80" y="60" width="44" height="240" rx="22" fill="#FFFFFF" stroke="#2B2622" stroke-width="2.5"/><circle cx="102" cy="300" r="34" fill="#C9473F" stroke="#2B2622" stroke-width="2.5"/><rect x="88" y="250" width="28" height="52" rx="6" fill="#8FB59A"/><path d="M126 276 L176 276" stroke="#2B2622" stroke-width="1.6"/><text class="l" x="186" y="274" text-anchor="start">Sussurro</text><text class="s" x="186" y="292" text-anchor="start">segredos</text><rect x="88" y="194" width="28" height="52" rx="6" fill="#E6B450"/><path d="M126 220 L176 220" stroke="#2B2622" stroke-width="1.6"/><text class="l" x="186" y="218" text-anchor="start">Fala tranquila</text><text class="s" x="186" y="236" text-anchor="start">conversa</text><rect x="88" y="138" width="28" height="52" rx="6" fill="#E8907A"/><path d="M126 164 L176 164" stroke="#2B2622" stroke-width="1.6"/><text class="l" x="186" y="162" text-anchor="start">Voz forte</text><text class="s" x="186" y="180" text-anchor="start">apresentação, palco</text><rect x="88" y="82" width="28" height="52" rx="6" fill="#C9473F"/><path d="M126 108 L176 108" stroke="#2B2622" stroke-width="1.6"/><text class="l" x="186" y="106" text-anchor="start">Grito</text><text class="s" x="186" y="124" text-anchor="start">só em emergência!</text><g transform="translate(470,80)"><rect x="0" y="0" width="140" height="200" rx="20" fill="#F7F0E4" stroke="#C29A55" stroke-width="2"/><text class="t" x="70" y="34" text-anchor="middle">Dica</text><text class="s" x="70" y="66" text-anchor="middle">Na maior parte</text><text class="s" x="70" y="84" text-anchor="middl