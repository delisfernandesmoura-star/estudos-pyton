<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340"><style>text{font-family:Nunito,Arial,sans-serif;fill:#2B2622} .t{font-family:Fredoka,Nunito,sans-serif;font-size:17px;font-weight:600;fill:#2B2622} .l{font-size:14px;font-weight:700} .s{font-size:12.5px;fill:#7a7068;font-weight:600}</style><text class="t" x="320" y="26" text-anchor="middle">O SEMÁFORO DA VOZ</text><rect x="60" y="50" width="110" height="270" rx="30" fill="#2B2622"/><circle cx="115" cy="96" r="30" fill="#8FB59A"/><text class="l" x="200" y="90" text-anchor="start">Verde: voz tranquila</text><text class="s" x="200" y="110" text-anchor="start">Siga cantando e se cuidando.</text><circle cx="115" cy="178" r="30" fill="#E6B450"/><text class="l" x="200" y="172" text-anchor="start">Amarelo: atenção</text><text class="s" x="200" y="192" text-anchor="start">Voz cansada ou rouca depois de usar muito:</text><text class="s" x="200" y="208" text-anchor="start">descanse, beba água.</text><circle cx="115" cy="260" r="30" fill="#C9473F"/><text class="l" x="200" y="254" text-anchor="start">Vermelho: hora de pedir ajuda</text><text class="s" x="200" y="274" text-anchor="start">Rouquidão por mais de 2 semanas, dor ou perda</text><text class="s" x="200" y="290" text-anchor="start">de voz: procure um fonoaudiólogo.</text></svg>