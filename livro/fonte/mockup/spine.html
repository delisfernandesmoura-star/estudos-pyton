<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
html,body{margin:0}
.c{width:150px;height:2264px;position:relative;overflow:hidden;background:#121212}
.noise{position:absolute;inset:0;opacity:.09;mix-blend-mode:screen}
.gold{background:linear-gradient(115deg,#8a6a32 0%,#e9d6a0 28%,#a9843f 48%,#f4e6b8 66%,#8c6c34 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.rot{position:absolute;left:50%;top:50%;width:2000px;height:150px;transform:translate(-50%,-50%) rotate(90deg);display:flex;align-items:center;justify-content:center;gap:60px;white-space:nowrap}
.t{font-family:Bodoni;font-size:62px;letter-spacing:.06em}
.dot{width:10px;height:10px;border-radius:50%;background:#B8975A}
.a{font-family:Inter;font-weight:600;font-size:26px;letter-spacing:.42em;color:#EFE8DC}
.mono{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-family:Bodoni;font-size:72px}
.line{position:absolute;left:36px;right:36px;height:1px;background:rgba(200,173,128,.6)}
</style></head><body><div class="c">
<svg class="noise" width="150" height="2264"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="150" height="2264" filter="url(#n)"/></svg>
<div class="line" style="top:110px"></div><div class="line" style="top:124px"></div>
<div class="rot"><span class="t gold">Voz, Canto e Ciência</span><span class="dot"></span><span class="a">DRA. BRÍZIA LACERDA</span></div>
<div class="mono gold">V</div>
<div class="line" style="bottom:90px"></div>
</div></body></html>
