<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280"><style>text{font-family:Inter,Helvetica,Arial,sans-serif;fill:#1F1F1F} .t{font-size:12px;font-weight:600;letter-spacing:2.4px;fill:#B8975A} .l{font-size:13px} .s{font-size:11.5px;fill:#6b655c}</style><text class="t" x="340" y="30" text-anchor="middle">YODEL: A QUEBRA ENTRE REGISTROS</text><rect x="50" y="70" width="580" height="50" fill="#EADFC8"/><rect x="50" y="160" width="580" height="50" fill="#CFCAC2" opacity=".5"/><text class="s" x="60" y="92" text-anchor="start">registro elevado (voz de cabeça)</text><text class="s" x="60" y="232" text-anchor="start">registro modal (voz de peito)</text><polyline points="50,185 130,185 140,95 220,95 230,185 300,185 310,95 400,95 410,185 480,185 490,95 630,95" fill="none" stroke="#1F1F1F" stroke-width="2.4" stroke-linejoin="round"/><circle cx="135" cy="140" r="5" fill="#B8975A"/><circle cx="225" cy="140" r="5" fill="#B8975A"/><circle cx="305" cy="140" r="5" fill="#B8975A"/><circle cx="405" cy="140" r="5" fill="#B8975A"/><circle cx="485" cy="140" r="5" fill="#B8975A"/><text class="s" x="340" y="262" text-anchor="middle">Cada ponto dourado é uma “quebra” intencional de registro.</text></svg>